# The Rust client of the real estate agency's catalogs, generated by xmeta codegen into src/: a
# module per position with a catalog (e.g. xboards_agencja_nieruchomosci::cases::klient) with its
# room, and in it a module per kind with typed operations.
[package]
name = "xboards-agencja-nieruchomosci"
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"
publish = false

[dependencies]
xmeta-room = { path = "../../../../mirrorboards-core/mirrorboards-xmeta/xmeta-rust/xmeta-room" }

# Its own workspace: CI builds the client from the XBoard alone, with this Cargo.lock.
[workspace]
